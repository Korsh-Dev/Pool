# ==============================================================================
# NGINX Configuration Template for Korsh Mining Pool
# Replace 'yourdomain.com' with your actual registered domain name.
# ==============================================================================

# HTTP / HTTPS Services (WebUI, API, Block Explorer)
http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Rate limiting zone for public endpoints
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # Upstream definitions
    upstream miningcore_api {
        server 127.0.0.1:4000;
        keepalive 32;
    }

    upstream pool_webui {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name pool.yourdomain.com api.yourdomain.com;
        return 301 https://$host$request_uri;
    }

    # Pool WebUI & Frontend Dashboard
    server {
        listen 443 ssl http2;
        server_name pool.yourdomain.com;

        # SSL Configuration (Certbot / Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/pool.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pool.yourdomain.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            proxy_pass http://pool_webui;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Direct proxy to API from WebUI path
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://miningcore_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Standalone API Subdomain
    server {
        listen 443 ssl http2;
        server_name api.yourdomain.com;

        ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

        location / {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://miningcore_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

